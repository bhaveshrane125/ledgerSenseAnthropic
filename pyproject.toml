[project]
name = "ledgersense"
version = "0.1.0"
description = "LedgerSense — three-way match POC (PO / GRN / Invoice) using Claude extraction."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.3",
    "anthropic>=1.6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ledgersense"
module-root = "src"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
